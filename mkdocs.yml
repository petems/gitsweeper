site_name: gitsweeper
site_description: A CLI tool for cleaning up merged git branches
site_author: Peter Souter
site_url: https://gitsweeper.readthedocs.io/

repo_url: https://github.com/petems/gitsweeper
repo_name: petems/gitsweeper
edit_uri: edit/master/docs/

copyright: Copyright &copy; Peter Souter

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - git-revision-date-localized:
      type: timeago
      fallback_to_build_date: true
      enable_creation_date: true
      enable_git_follow: false
      strict: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/petems/gitsweeper
      name: gitsweeper on GitHub

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Usage:
      - Commands: usage/commands.md
      - Flags: usage/flags.md
      - Squash-Merge Detection: usage/squash-merge-detection.md
  - Explanation:
      - Motivation: explanation/motivation.md
      - Architecture: explanation/architecture.md
      - Detection Strategy: explanation/detection-strategy.md
  - Contributing:
      - Development: contributing/development.md
      - Testing: contributing/testing.md
      - Release Process: contributing/release-process.md
  - Reference:
      - Homebrew Formula: reference/homebrew-formula.md
  - History:
      - Overview: history/index.md
      - Detection Advice (original): history/advice-original.md
      - Code Reviews:
          - GoReleaser Migration: history/code-reviews/goreleaser-migration.md
          - Optimization Results: history/code-reviews/optimization-results.md
          - Final Optimization Report: history/code-reviews/final-optimization-report.md
          - Optimization Summary: history/code-reviews/optimization-summary.md
          - Improvements: history/code-reviews/improvements.md
          - Advanced Optimization Analysis: history/code-reviews/advanced-optimization-analysis.md
          - Performance Analysis: history/code-reviews/performance-analysis.md
